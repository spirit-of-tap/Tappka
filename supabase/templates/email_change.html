<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Potvrďte svůj email - Tappka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0; font-family: 'Roboto', Arial, sans-serif; background-color: #f5f5f5;">
  <table role="presentation" style="width: 100%; border-collapse: collapse;">
    <tr>
      <td style="padding: 40px 20px;">
        <table role="presentation" style="max-width: 600px; margin: 0 auto; background-color: #FBFFF5; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
          
          <!-- Header -->
          <tr>
            <td style="padding: 32px 40px 24px; text-align: center; border-bottom: 1px solid #e5e5e5;">
              <h1 style="margin: 0 0 8px; font-family: 'Poppins', Arial, sans-serif; font-size: 32px; font-weight: 700; color: #b31b1b; letter-spacing: -0.5px;">
                Tappka
              </h1>
              <p style="margin: 0; font-size: 14px; color: #2c1a1d; opacity: 0.7; font-weight: 400;">
                Pro téčka a kouče Tiimiakatemia Prague
              </p>
            </td>
          </tr>

          <!-- Main Content -->
          <tr>
            <td style="padding: 40px 40px 32px;">
              <h2 style="margin: 0 0 16px; font-family: 'Poppins', Arial, sans-serif; font-size: 24px; font-weight: 600; color: #2c1a1d; line-height: 1.3;">
                Potvrďte svůj email
              </h2>
              
              <p style="margin: 0 0 32px; font-size: 16px; line-height: 1.6; color: #2c1a1d; opacity: 0.8;">
                Klikněte na tlačítko níže a potvrďte svůj email:
              </p>

              <!-- CTA Button -->
              <table role="presentation" style="margin: 0 auto;">
                <tr>
                  <td style="text-align: center;">
                    <a href="{{ .RedirectTo }}token_hash={{ .TokenHash }}&type=email_change" 
                       style="display: inline-block; padding: 14px 32px; background-color: #b31b1b; color: #FBFFF5; text-decoration: none; font-family: 'Roboto', Arial, sans-serif; font-size: 16px; font-weight: 500; border-radius: 6px; transition: background-color 0.2s;">
                      Potvrdit email
                    </a>
                  </td>
                </tr>
              </table>

              <!-- Divider -->
              <div style="margin: 32px 0; border-top: 1px solid #e5e5e5;"></div>

              <!-- Alternative Token -->
              <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #2c1a1d; opacity: 0.7; text-align: center;">
                Nebo zadejte tento kód:
              </p>
              <p style="margin: 8px 0 0; font-family: 'Roboto', monospace; font-size: 18px; font-weight: 500; color: #2c1a1d; text-align: center; letter-spacing: 1px;">
                {{ .Token }}
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 40px; text-align: center; border-top: 1px solid #e5e5e5;">
              <p style="margin: 0; font-size: 12px; color: #2c1a1d; opacity: 0.6;">
                © 2026 Tappka. Všechna práva vyhrazena.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
