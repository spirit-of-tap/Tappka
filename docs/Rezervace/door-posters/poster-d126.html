<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D126 — Door Poster | Tiimiakatemia Prague</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Roboto:wght@400;500&display=swap');

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    html, body {
      width: 210mm;
      height: 297mm;
      background: #fcfff7;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      font-family: 'Roboto', sans-serif;
      color: #2c1a1d;
      overflow: hidden;
    }

    .page {
      width: 210mm;
      height: 297mm;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fcfff7;
    }

    /* ── Top accent bar ── */
    .accent-bar {
      width: 100%;
      height: 6px;
      background: #b31b1b;
      flex-shrink: 0;
    }

    /* ── Content wrapper ── */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20mm;
      gap: 0;
    }

    /* ── Logo ── */
    .logo {
      margin-bottom: 12mm;
    }
    .logo img {
      width: 180px;
      height: auto;
      display: block;
    }

    /* ── Room number ── */
    .room-number {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 96px;
      color: #2c1a1d;
      line-height: 1;
      letter-spacing: 2px;
      margin-bottom: 4mm;
    }

    .room-subtitle {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 16px;
      color: #2c1a1d;
      opacity: 0.5;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 14mm;
    }

    /* ── QR code ── */
    .qr-code {
      margin-bottom: 10mm;
    }
    .qr-code img {
      width: 250px;
      height: 250px;
      display: block;
      border: 3px solid #2c1a1d;
      border-radius: 12px;
      padding: 8px;
      background: #fff;
    }

    /* ── NFC section ── */
    .nfc-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3mm;
      margin-bottom: 10mm;
    }

    .nfc-divider {
      display: flex;
      align-items: center;
      gap: 4mm;
      width: 60mm;
      margin-bottom: 2mm;
    }
    .nfc-divider .line {
      flex: 1;
      height: 1px;
      background: #2c1a1d;
      opacity: 0.2;
    }
    .nfc-divider .or-text {
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: #2c1a1d;
      opacity: 0.4;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nfc-icon-row {
      display: flex;
      align-items: center;
      gap: 3mm;
    }

    .nfc-icon svg {
      width: 44px;
      height: 44px;
      display: block;
    }

    .nfc-text {
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: 15px;
      color: #b31b1b;
    }

    /* ── Instructions ── */
    .instructions {
      text-align: center;
      margin-bottom: 10mm;
    }
    .instructions .main-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 20px;
      color: #2c1a1d;
      margin-bottom: 3mm;
      line-height: 1.3;
    }
    .instructions .sub-text {
      font-family: 'Roboto', sans-serif;
      font-weight: 400;
      font-size: 14px;
      color: #2c1a1d;
      opacity: 0.6;
      line-height: 1.5;
    }

    /* ── Footer ── */
    .footer {
      margin-top: auto;
      padding-bottom: 10mm;
      text-align: center;
    }
    .footer .url {
      font-family: 'Roboto', sans-serif;
      font-weight: 500;
      font-size: 13px;
      color: #2c1a1d;
      opacity: 0.35;
      letter-spacing: 2px;
      text-transform: lowercase;
    }

    /* ── Print styles ── */
    @media print {
      html, body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .page {
        page-break-after: avoid;
      }
    }
  </style>
</head>
