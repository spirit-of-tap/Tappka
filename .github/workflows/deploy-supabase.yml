name: Deploy Supabase Database

on:
  push:
    branches:
      - preview
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - preview
          - production

jobs:
  deploy_staging:
    environment: preview
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/preview' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PREVIEW_PROJECT_ID }}
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Deploy migrations
        run: |
          supabase link --project-ref $PROJECT_ID
          supabase db push
  deploy_production:
    environment: production
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Deploy migrations
        run: |
          supabase link --project-ref $PROJECT_ID
          supabase db push