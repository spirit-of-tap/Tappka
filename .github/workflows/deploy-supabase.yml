name: Deploy Supabase Resources

on:
  push:
    branches:
      - preview
      - production
    paths:
      - 'supabase/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - preview
          - production

jobs:
  deploy_preview:
    environment: preview
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/preview' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PREVIEW_PROJECT_ID }}
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Link Supabase project
        run: |
          supabase link --project-ref $PROJECT_ID
          
      - name: Deploy database migrations
        run: |
          supabase db push || (supabase db reset --linked --yes && supabase db push --include-linked)
          
      - name: Deploy Edge Functions
        continue-on-error: true
        run: |
          if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions)" ]; then
            echo "Deploying Edge Functions..."
            supabase functions deploy
          else
            echo "No Edge Functions found, skipping deployment."
          fi
          
      - name: Deploy Edge Function secrets
        continue-on-error: true
        run: |
          if [ -f "supabase/.env.secrets" ]; then
            echo "Deploying Edge Function secrets..."
            supabase secrets set --env-file supabase/.env.secrets
          else
            echo "No secrets file found, skipping secrets deployment."
          fi
          
  deploy_production:
    environment: production
    runs-on: blacksmith-2vcpu-ubuntu-2404
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Link Supabase project
        run: |
          supabase link --project-ref $PROJECT_ID
          
      - name: Deploy database migrations
        run: |
          supabase db push
          
      - name: Deploy Edge Functions
        continue-on-error: true
        run: |
          if [ -d "supabase/functions" ] && [ "$(ls -A supabase/functions)" ]; then
            echo "Deploying Edge Functions..."
            supabase functions deploy
          else
            echo "No Edge Functions found, skipping deployment."
          fi
          
      - name: Deploy Edge Function secrets
        continue-on-error: true
        run: |
          if [ -f "supabase/.env.secrets" ]; then
            echo "Deploying Edge Function secrets..."
            supabase secrets set --env-file supabase/.env.secrets
          else
            echo "No secrets file found, skipping secrets deployment."
          fi