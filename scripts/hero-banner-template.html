<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tappka — README hero banner</title>
<style>
  /* Brand faces only: Poppins for the wordmark, Roboto for everything else. */
  @font-face { font-family: "Poppins"; src: url("../src/app/fonts/poppins-800.woff2") format("woff2"); font-weight: 800; }
  @font-face { font-family: "Poppins"; src: url("../src/app/fonts/poppins-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "Roboto"; src: url("../src/app/fonts/roboto-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "Roboto"; src: url("../src/app/fonts/roboto-500.woff2") format("woff2"); font-weight: 500; }

  /* Tokens mirror DESIGN.md / globals.css light theme. */
  :root {
    --paper: #fcfff7;
    --ink: #2c1a1d;
    --red: #b31b1b;
    --hairline: rgba(44, 26, 29, 0.14);
    --ink-70: rgba(44, 26, 29, 0.72);
    --ink-50: rgba(44, 26, 29, 0.52);
    --strip: rgba(44, 26, 29, 0.035);
    --pad: 68px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1440px;
    height: 440px;
    background: transparent;
    font-family: "Roboto", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1440px;
    height: 440px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    overflow: hidden;
    display: grid;
    grid-template-rows: 1fr auto;
  }

  /* ---------- Upper field: wordmark, sentence, institutions ---------- */
  .field {
    position: relative;
    padding: 52px var(--pad) 0;
    display: flex;
    flex-direction: column;
  }

  .wordmark {
    font-family: "Poppins", sans-serif;
    font-weight: 800;
    font-size: 126px;
    line-height: 0.9;
    letter-spacing: -0.045em;
    color: var(--ink);
  }

  .lede {
    margin-top: 24px;
    font-size: 24px;
    line-height: 1.45;
    color: var(--ink-70);
  }

  .institutions {
    margin-top: auto;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 22px;
  }

  .institutions img {
    height: 50px;
    width: auto;
    display: block;
  }

  .institutions .divider {
    width: 1px;
    height: 38px;
    background: var(--hairline);
  }

  .institutions .name {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: 0.005em;
    color: var(--ink);
  }

  /* The Tiimiakatemia figure, standing on the week strip. */
  .mark {
    position: absolute;
    right: 150px;
    bottom: 0;
    height: 318px;
    width: auto;
    display: block;
  }

  /* ---------- Lower strip: this week in the rooms ---------- */
  .week {
    position: relative;
    z-index: 2;
    border-top: 1px solid var(--hairline);
    background: var(--strip);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    padding: 0 calc(var(--pad) - 22px);
  }

  .day {
    padding: 20px 22px 22px;
    border-left: 1px solid var(--hairline);
  }

  .day:first-child { border-left: 0; }

  .day .when {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-size: 16px;
    font-weight: 500;
    color: var(--ink);
  }

  .day .room {
    font-size: 15px;
    font-weight: 500;
    color: var(--red);
    letter-spacing: 0.01em;
  }

  .day .what {
    margin-top: 6px;
    font-size: 15px;
    line-height: 1.3;
    color: var(--ink-50);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="field">
      <h1 class="wordmark">Tappka</h1>

      <p class="lede">
        Book a room, borrow a book, hand in the essay.<br />
        One platform for Prague’s team-entrepreneurship program.
      </p>

      <div class="institutions">
        <img src="../public/pef_logo/CZU_PEF_cerna_RGB.png" alt="ČZU — Provozně ekonomická fakulta" />
        <span class="divider"></span>
        <span class="name">Tiimiakatemia Prague</span>
      </div>

      <img class="mark" src="../.github/assets/tap-mark.png" alt="" />
    </div>

    <div class="week">
      <div class="day">
        <div class="when">Po 13:00 <span class="room">D107</span></div>
        <div class="what">Workshop – Back to basics #7</div>
      </div>
      <div class="day">
        <div class="when">Út 14:00 <span class="room">D132</span></div>
        <div class="what">TM Paviaan</div>
      </div>
      <div class="day">
        <div class="when">St 10:00 <span class="room">D226</span></div>
        <div class="what">Koučovačka Kaamos</div>
      </div>
      <div class="day">
        <div class="when">Čt 15:30 <span class="room">D127</span></div>
        <div class="what">Psaní esejí</div>
      </div>
      <div class="day">
        <div class="when">Pá 9:00 <span class="room">D129</span></div>
        <div class="what">Prezentace projektů</div>
      </div>
    </div>
  </div>
</body>
</html>
