onlyBuiltDependencies:
  - core-js
  - cpu-features
  - esbuild
  - protobufjs
  - sharp
  - ssh2
  - supabase
  - unrs-resolver

overrides:
  # Pin within the same major. Open-ended targets like `>=6.14.0` let pnpm
  # jump to ajv 8 / minimatch 9+, which break packages that expect the old API.
  ajv@<6.14.0: "6.14.0"
  minimatch@<3.1.5: "3.1.5"
  minimatch@>=9.0.0 <9.0.9: "9.0.9"
  fast-xml-parser@>=5.0.0 <5.3.8: "5.3.8"
  fast-xml-parser@>=5.0.9 <=5.3.3: "5.3.8"
  tar@<7.5.8: "7.5.20"
